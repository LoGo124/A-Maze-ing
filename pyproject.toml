[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Un generador de laberintos perfecto y loops reutilizable para 42"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [
    {name = "Maria Gabriela Reyes Mosquera", email = "mreyes-m@student.42barcelona.com"},
    {name = "Ignacio López Gómez", email = "ilopez-g@student.42barcelona.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]